[project]
name = "dogear"
version = "2.0.0.dev0"
description = "A self-hosted recipe box and cooking guide."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0,<7",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["dogear"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
