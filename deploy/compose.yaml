# For machines with Docker Compose. On CoreELEC, use the docker run
# commands in docs/INSTALL.md instead.
services:
  dogear:
    image: ghcr.io/mbowron/dogear:latest
    restart: unless-stopped
    volumes:
      - ./recipes:/recipes
      - ./data:/data
    ports:
      - "8000:8000"

  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: dogear
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=dogear
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
